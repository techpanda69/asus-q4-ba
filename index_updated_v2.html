<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ASUS BA Q4</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      color: #f4f4f5;
      font-family: Arial, Helvetica, sans-serif;
      background:
        linear-gradient(rgba(9, 9, 11, 0.82), rgba(9, 9, 11, 0.92)),
        url("/bg.png");
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
      background-repeat: no-repeat;
    }

    .container {
      width: 100%;
      max-width: 1280px;
      margin: 0 auto;
      padding: 24px 16px 50px;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
      margin-bottom: 28px;
      flex-wrap: wrap;
    }

    .brand h1 {
      margin: 0;
      font-size: 28px;
      font-weight: 800;
      letter-spacing: -0.5px;
    }

    .brand p {
      margin: 5px 0 0;
      color: #a1a1aa;
      font-size: 14px;
    }

    .status {
      color: #a1a1aa;
      font-size: 13px;
      text-align: right;
    }

    .controls { margin-bottom: 22px; }

    select {
      width: 100%;
      max-width: 320px;
      background: #18181b;
      color: #f4f4f5;
      border: 1px solid #3f3f46;
      border-radius: 8px;
      padding: 12px 14px;
      font-size: 15px;
      outline: none;
      cursor: pointer;
    }

    #content { width: 100%; }

    .loading,
    .error {
      padding: 40px 20px;
      text-align: center;
      color: #a1a1aa;
      background: rgba(17, 17, 19, 0.92);
      border: 1px solid #27272a;
      border-radius: 10px;
    }

    .error { color: #f87171; }

    /* TABLE */

    .table-wrap {
      width: 100%;
      overflow-x: auto;
      border: 1px solid #27272a;
      border-radius: 10px;
      background: rgba(17, 17, 19, 0.94);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 650px;
    }

    th {
      background: #18181b;
      color: #d4d4d8;
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .5px;
      padding: 14px 12px;
      text-align: center;
      border-bottom: 1px solid #27272a;
      white-space: nowrap;
    }

    td {
      padding: 14px 12px;
      border-bottom: 1px solid #27272a;
      color: #f4f4f5;
      font-size: 14px;
      text-align: center;
      white-space: nowrap;
    }

    tr:last-child td { border-bottom: none; }
    tbody tr:hover { background: #18181b; }

    /* OVERALL TOP 9 STRIP */

    .top9-strip {
      width: 100%;
      margin: 0 0 22px;
      overflow-x: auto;
      padding-bottom: 2px;
    }

    .top9-inner {
      display: grid;
      grid-template-columns: repeat(9, minmax(110px, 1fr));
      min-width: 990px;
      border: 1px solid #303036;
      border-radius: 10px;
      overflow: hidden;
      background: rgba(17, 17, 19, .96);
    }

    .top9-item {
      min-height: 62px;
      padding: 9px 10px;
      border-right: 1px solid #27272a;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 3px;
    }

    .top9-item:last-child {
      border-right: none;
    }

    .top9-rank {
      color: #71717a;
      font-size: 9px;
      font-weight: 800;
      letter-spacing: .7px;
      text-transform: uppercase;
    }

    .top9-name {
      color: #f4f4f5;
      font-size: 12px;
      font-weight: 800;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .top9-item.empty .top9-name {
      color: #52525b;
    }

    /* BRACKET */

    .bracket-page {
      width: 100%;
    }

    .bracket-heading {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 20px;
      margin: 4px 0 18px;
    }

    .bracket-heading h2 {
      margin: 0;
      font-size: 21px;
    }

    .bracket-heading p {
      margin: 4px 0 0;
      color: #71717a;
      font-size: 12px;
    }

    .bracket-scroll {
      overflow-x: auto;
      padding-bottom: 14px;
      scrollbar-width: thin;
    }

    .bracket-area {
      min-width: 1120px;
    }

    .bracket-zone {
      margin-bottom: 30px;
    }

    .zone-title {
      color: #a1a1aa;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: .8px;
      text-transform: uppercase;
      margin: 0 0 12px 2px;
    }

    .bracket-row {
      display: grid;
      gap: 22px;
      align-items: start;
    }

    .winner-row {
      grid-template-columns: repeat(3, minmax(220px, 1fr));
    }

    .lower-row {
      grid-template-columns: repeat(5, minmax(190px, 1fr));
    }

    .round-column {
      min-width: 0;
    }

    .round-label {
      color: #71717a;
      font-size: 10px;
      font-weight: 800;
      letter-spacing: .8px;
      text-transform: uppercase;
      margin: 0 0 9px 2px;
    }

    .match-stack {
      display: flex;
      flex-direction: column;
    }

    .match-stack.qf { gap: 20px; }
    .match-stack.sf { padding-top: 64px; gap: 126px; }
    .match-stack.final { padding-top: 150px; }

    .match-stack.lb1 { gap: 20px; }
    .match-stack.lb2 { padding-top: 62px; gap: 128px; }
    .match-stack.lb3 { padding-top: 150px; }
    .match-stack.lb4 { padding-top: 74px; gap: 150px; }
    .match-stack.lb5 { padding-top: 170px; }

    .match-card {
      background: rgba(17, 17, 19, .96);
      border: 1px solid #303036;
      border-radius: 9px;
      overflow: hidden;
      box-shadow: 0 8px 24px rgba(0,0,0,.18);
      position: relative;
    }

    .match-title {
      padding: 8px 10px;
      background: #18181b;
      color: #a1a1aa;
      font-size: 10px;
      font-weight: 800;
      letter-spacing: .6px;
      text-transform: uppercase;
      border-bottom: 1px solid #27272a;
      display: flex;
      justify-content: space-between;
      gap: 8px;
    }

    .placement-label {
      color: #71717a;
      font-weight: 700;
      text-transform: none;
      letter-spacing: 0;
    }

    .player {
      min-height: 42px;
      padding: 10px 11px;
      font-size: 13px;
      border-bottom: 1px solid #27272a;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .player:last-child { border-bottom: none; }

    .player.winner {
      font-weight: 800;
      background: rgba(34, 197, 94, .045);
    }

    .player-name {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .winner-pill {
      display: inline-flex;
      align-items: center;
      padding: 3px 7px;
      border-radius: 999px;
      background: rgba(34, 197, 94, .12);
      border: 1px solid rgba(34, 197, 94, .35);
      color: #4ade80;
      font-size: 8px;
      font-weight: 800;
      letter-spacing: .5px;
      flex-shrink: 0;
    }

    .empty-player {
      color: #52525b;
    }

    /* MOBILE */

    @media (max-width: 800px) {
      .container { padding: 18px 12px 40px; }
      header { align-items: flex-start; }
      .brand h1 { font-size: 24px; }
      .status { text-align: left; }
    }

    @media (max-width: 520px) {
      select { max-width: 100%; }
      table { min-width: 600px; }
    }
  </style>
</head>

<body>
  <div class="container">

    <header>
      <div class="brand">
        <h1>ASUS BA Q4</h1>
        <p>Live Competition Leaderboard</p>
      </div>

      <div class="status" id="status">Loading...</div>
    </header>

    <div class="controls">
      <select id="gameSelect">
        <option value="overall">Overall</option>
        <option value="Valorant">Valorant</option>
        <option value="Cube Racer 2">Cube Racer 2</option>
        <option value="Brawlhalla">Brawlhalla</option>
        <option value="Fall Guys">Fall Guys</option>
        <option value="Rocket League">Rocket League</option>
      </select>
    </div>

    <div id="content">
      <div class="loading">Loading leaderboard...</div>
    </div>

  </div>

  <script>
    const API_URL = "/api/leaderboard";

    let leaderboardData = {};
    let currentView = "overall";

    async function loadLeaderboard() {
      try {
        setStatus("Updating...");

        const response = await fetch(API_URL, {
          cache: "no-store"
        });

        if (!response.ok) {
          throw new Error(`API returned ${response.status}`);
        }

        const data = await response.json();

        if (!data || typeof data !== "object") {
          throw new Error("Invalid API response");
        }

        leaderboardData = data;
        renderCurrentView();

        setStatus(
          "Updated " +
          new Date().toLocaleTimeString([], {
            hour: "2-digit",
            minute: "2-digit"
          })
        );
      } catch (error) {
        console.error("Leaderboard loading error:", error);
        setStatus("Connection error");

        document.getElementById("content").innerHTML = `
          <div class="error">
            Unable to load leaderboard.<br><br>
            Please refresh the page.
          </div>
        `;
      }
    }

    function setStatus(text) {
      const status = document.getElementById("status");
      if (status) status.textContent = text;
    }

    function renderCurrentView() {
      if (!leaderboardData ||
          Object.keys(leaderboardData).length === 0) {
        document.getElementById("content").innerHTML =
          `<div class="loading">No leaderboard data available.</div>`;
        return;
      }

      if (currentView === "overall") {
        renderTable("overall");
        return;
      }

      if (currentView === "Brawlhalla") {
        renderBrawlhallaBracket();
        return;
      }

      if (currentView === "Rocket League") {
        renderRocketLeagueBracket();
        return;
      }

      renderTable(currentView);
    }

    function renderTable(sheetName) {
      const data = leaderboardData[sheetName];

      if (!data || !data.length) {
        document.getElementById("content").innerHTML =
          `<div class="error">No data found for ${escapeHTML(sheetName)}.</div>`;
        return;
      }

      let headerIndex = -1;

      for (let i = 0; i < data.length; i++) {
        const row = data[i].map(v => String(v).trim().toLowerCase());
        const nonEmpty = row.filter(v => v !== "");

        const hasRank =
          row.includes("rank") ||
          row.includes("overall rank");

        const hasPlayer =
          row.includes("creator") ||
          row.includes("player");

        if (nonEmpty.length >= 2 && hasRank && hasPlayer) {
          headerIndex = i;
          break;
        }
      }

      if (headerIndex === -1) {
        for (let i = 0; i < data.length; i++) {
          const row = data[i].map(v => String(v).trim().toLowerCase());
          const nonEmpty = row.filter(v => v !== "");

          if (
            nonEmpty.length >= 2 &&
            (
              row.includes("rank") ||
              row.includes("creator") ||
              row.includes("player") ||
              row.includes("total")
            )
          ) {
            headerIndex = i;
            break;
          }
        }
      }

      if (headerIndex === -1) {
        document.getElementById("content").innerHTML =
          `<div class="error">Could not detect table headers.</div>`;
        return;
      }

      const headers = data[headerIndex];

      const rows = data
        .slice(headerIndex + 1)
        .filter(row =>
          row.some(cell => String(cell).trim() !== "")
        );

      let html = `
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
      `;

      headers.forEach(header => {
        html += `<th>${escapeHTML(header)}</th>`;
      });

      html += `
              </tr>
            </thead>
            <tbody>
      `;

      rows.forEach(row => {
        html += "<tr>";

        headers.forEach((_, index) => {
          const value =
            row[index] !== undefined ? row[index] : "";

          html += `<td>${escapeHTML(value)}</td>`;
        });

        html += "</tr>";
      });

      html += `
            </tbody>
          </table>
        </div>
      `;

      document.getElementById("content").innerHTML = html;
    }

    /* =====================================================
       BRACKET DATA
       ===================================================== */

    function getBracketRows(sheetName) {
      const data = leaderboardData[sheetName];

      if (!data || !data.length) return null;

      let headerIndex = -1;

      for (let i = 0; i < data.length; i++) {
        const row = data[i].map(v =>
          String(v).trim().toLowerCase()
        );

        if (
          row.includes("match") &&
          row.includes("p1") &&
          row.includes("p2") &&
          row.includes("win") &&
          row.includes("loss")
        ) {
          headerIndex = i;
          break;
        }
      }

      if (headerIndex === -1) return null;

      return data
        .slice(headerIndex + 1)
        .filter(row =>
          row.some(cell => String(cell).trim() !== "")
        )
        .map(row => ({
          match: String(row[0] || "").trim(),
          p1: String(row[1] || "").trim(),
          p2: String(row[2] || "").trim(),
          win: String(row[3] || "").trim()
        }));
    }

    function matchMap(rows) {
      const map = {};

      rows.forEach(row => {
        map[row.match.toUpperCase()] = row;
      });

      return map;
    }

    function renderTop9Strip() {
      const data = leaderboardData["overall"];

      if (!data || !data.length) return "";

      let headerIndex = -1;

      for (let i = 0; i < data.length; i++) {
        const row = data[i].map(v =>
          String(v).trim().toLowerCase()
        );

        if (
          (row.includes("overall rank") || row.includes("rank")) &&
          (row.includes("creator") || row.includes("player"))
        ) {
          headerIndex = i;
          break;
        }
      }

      if (headerIndex === -1) return "";

      const headers = data[headerIndex];
      const rankIndex = headers.findIndex(h =>
        ["overall rank", "rank"].includes(
          String(h).trim().toLowerCase()
        )
      );
      const playerIndex = headers.findIndex(h =>
        ["creator", "player"].includes(
          String(h).trim().toLowerCase()
        )
      );

      if (rankIndex === -1 || playerIndex === -1) return "";

      const players = {};

      data.slice(headerIndex + 1).forEach(row => {
        const rank = String(row[rankIndex] || "").trim();
        const player = String(row[playerIndex] || "").trim();

        if (/^[1-9]$/.test(rank)) {
          players[rank] = player;
        }
      });

      let html = `
        <div class="top9-strip">
          <div class="top9-inner">
      `;

      for (let i = 1; i <= 9; i++) {
        const player = players[String(i)] || "";

        html += `
          <div class="top9-item ${player ? "" : "empty"}">
            <div class="top9-rank">#${i}</div>
            <div class="top9-name">
              ${escapeHTML(player || "-")}
            </div>
          </div>
        `;
      }

      html += `
          </div>
        </div>
      `;

      return html;
    }

    function renderBrawlhallaBracket() {
      const rows = getBracketRows("Brawlhalla");

      if (!rows) {
        document.getElementById("content").innerHTML =
          `<div class="error">Could not detect Brawlhalla bracket data.</div>`;
        return;
      }

      const matches = matchMap(rows);

      const winnerLabels = {
        M7: "#1 / #2",
        M12: "#3 / #4",
        M15: "#5 / #6",
        M16: "#7 / #8"
      };

      const html = `
        <div class="bracket-page">

          ${renderTop9Strip()}

          <div class="bracket-heading">
            <div>
              <h2>Brawlhalla Bracket</h2>
              <p>8-player placement bracket</p>
            </div>
          </div>

          <div class="bracket-scroll">
            <div class="bracket-area">

              <section class="bracket-zone">
                <div class="zone-title">Winners Bracket</div>

                <div class="bracket-row winner-row">

                  <div class="round-column">
                    <div class="round-label">Quarter Finals</div>
                    <div class="match-stack qf">
                      ${card(matches.M1)}
                      ${card(matches.M2)}
                      ${card(matches.M3)}
                      ${card(matches.M4)}
                    </div>
                  </div>

                  <div class="round-column">
                    <div class="round-label">Semi Finals</div>
                    <div class="match-stack sf">
                      ${card(matches.M5)}
                      ${card(matches.M6)}
                    </div>
                  </div>

                  <div class="round-column">
                    <div class="round-label">Final</div>
                    <div class="match-stack final">
                      ${card(matches.M7, winnerLabels.M7)}
                    </div>
                  </div>

                </div>
              </section>

              <section class="bracket-zone">
                <div class="zone-title">Lower Bracket</div>

                <div class="bracket-row lower-row">

                  <div class="round-column">
                    <div class="round-label">Lower Round 1</div>
                    <div class="match-stack lb1">
                      ${card(matches.M8)}
                      ${card(matches.M9)}
                    </div>
                  </div>

                  <div class="round-column">
                    <div class="round-label">Lower Round 2</div>
                    <div class="match-stack lb2">
                      ${card(matches.M10)}
                      ${card(matches.M11)}
                    </div>
                  </div>

                  <div class="round-column">
                    <div class="round-label">3rd / 4th</div>
                    <div class="match-stack lb3">
                      ${card(matches.M12, winnerLabels.M12)}
                    </div>
                  </div>

                  <div class="round-column">
                    <div class="round-label">Placement</div>
                    <div class="match-stack lb4">
                      ${card(matches.M13)}
                      ${card(matches.M14)}
                    </div>
                  </div>

                  <div class="round-column">
                    <div class="round-label">Final Placements</div>
                    <div class="match-stack lb5">
                      ${card(matches.M15, winnerLabels.M15)}
                      ${card(matches.M16, winnerLabels.M16)}
                    </div>
                  </div>

                </div>
              </section>

            </div>
          </div>
        </div>
      `;

      document.getElementById("content").innerHTML = html;
    }

    function renderRocketLeagueBracket() {
      const rows = getBracketRows("Rocket League");

      if (!rows) {
        document.getElementById("content").innerHTML =
          `<div class="error">Could not detect Rocket League bracket data.</div>`;
        return;
      }

      const qf = rows.filter(r =>
        r.match.toUpperCase().startsWith("QF")
      );

      const sf = rows.filter(r =>
        r.match.toUpperCase().startsWith("SF")
      );

      const finals = rows.filter(r =>
        r.match.toUpperCase().startsWith("FINALE")
      );

      const html = `
        <div class="bracket-page">

          ${renderTop9Strip()}

          <div class="bracket-heading">
            <div>
              <h2>Rocket League Bracket</h2>
              <p>Live match results</p>
            </div>
          </div>

          <div class="bracket-scroll">
            <div class="bracket-area">

              <div class="bracket-row winner-row">

                <div class="round-column">
                  <div class="round-label">Quarter Finals</div>
                  <div class="match-stack qf">
                    ${qf.map(card).join("")}
                  </div>
                </div>

                <div class="round-column">
                  <div class="round-label">Semi Finals</div>
                  <div class="match-stack sf">
                    ${sf.map(card).join("")}
                  </div>
                </div>

                <div class="round-column">
                  <div class="round-label">Final</div>
                  <div class="match-stack final">
                    ${finals.map(card).join("")}
                  </div>
                </div>

              </div>

            </div>
          </div>

        </div>
      `;

      document.getElementById("content").innerHTML = html;
    }

    function card(match, placementLabel = "") {
      if (!match) {
        return `
          <div class="match-card">
            <div class="match-title">MATCH</div>
            <div class="player empty-player">-</div>
            <div class="player empty-player">-</div>
          </div>
        `;
      }

      const winner = match.win.toLowerCase();
      const p1Winner =
        match.p1 !== "" &&
        winner !== "" &&
        match.p1.toLowerCase() === winner;

      const p2Winner =
        match.p2 !== "" &&
        winner !== "" &&
        match.p2.toLowerCase() === winner;

      return `
        <div class="match-card">

          <div class="match-title">
            <span>${escapeHTML(match.match)}</span>
            ${
              placementLabel
                ? `<span class="placement-label">${escapeHTML(placementLabel)}</span>`
                : ""
            }
          </div>

          <div class="player ${p1Winner ? "winner" : ""}">
            <span class="player-name ${
              match.p1 ? "" : "empty-player"
            }">
              ${escapeHTML(match.p1 || "-")}
            </span>

            ${
              p1Winner
                ? `<span class="winner-pill">WINNER</span>`
                : ""
            }
          </div>

          <div class="player ${p2Winner ? "winner" : ""}">
            <span class="player-name ${
              match.p2 ? "" : "empty-player"
            }">
              ${escapeHTML(match.p2 || "-")}
            </span>

            ${
              p2Winner
                ? `<span class="winner-pill">WINNER</span>`
                : ""
            }
          </div>

        </div>
      `;
    }

    function escapeHTML(value) {
      return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    document
      .getElementById("gameSelect")
      .addEventListener("change", function () {
        currentView = this.value;
        renderCurrentView();
      });

    loadLeaderboard();

    setInterval(loadLeaderboard, 30000);
  </script>
</body>
</html>
