<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TUF GAMES 2026</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      color: #f4f4f5;
      font-family: 'Montserrat', sans-serif;
      background:
        linear-gradient(rgba(9, 9, 11, 0.82), rgba(9, 9, 11, 0.92)),
        url("/bg.png");
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
      background-repeat: no-repeat;
    }

    .container {
      width: 100%;
      max-width: 1280px;
      margin: 0 auto;
      padding: 24px 16px 50px;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
      margin-bottom: 28px;
      flex-wrap: wrap;
    }

    .brand h1 {
      margin: 0;
      font-size: 28px;
      font-weight: 800;
      letter-spacing: -0.5px;
      font-family: Arial, Helvetica, sans-serif;
    }

    .brand p {
      margin: 5px 0 0;
      color: #a1a1aa;
      font-size: 14px;
    }

    .status {
      color: #a1a1aa;
      font-size: 13px;
      text-align: right;
    }

    .controls { margin-bottom: 22px; }

    select {
      width: 100%;
      max-width: 320px;
      background: #18181b;
      color: #f4f4f5;
      border: 1px solid #3f3f46;
      border-radius: 8px;
      padding: 12px 14px;
      font-size: 15px;
      outline: none;
      cursor: pointer;
    }

    #content { width: 100%; }

    .loading,
    .error {
      padding: 40px 20px;
      text-align: center;
      color: #a1a1aa;
      background: rgba(17, 17, 19, 0.92);
      border: 1px solid #27272a;
      border-radius: 10px;
    }

    .error { color: #f87171; }

    /* TABLE */

    .table-wrap {
      width: 100%;
      overflow-x: auto;
      border: 1px solid #27272a;
      border-radius: 10px;
      background: rgba(17, 17, 19, 0.94);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 650px;
    }

    th {
      background: #18181b;
      color: #d4d4d8;
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .5px;
      padding: 14px 12px;
      text-align: center;
      border-bottom: 1px solid #27272a;
      white-space: nowrap;
    }

    td {
      padding: 14px 12px;
      border-bottom: 1px solid #27272a;
      color: #f4f4f5;
      font-size: 14px;
      text-align: center;
      white-space: nowrap;
    }

    tr:last-child td { border-bottom: none; }
    tbody tr:hover { background: #18181b; }

    /* OVERALL TOP 9 STRIP */

    .top9-strip {
      width: 100%;
      margin: 0 0 22px;
      overflow-x: auto;
      padding-bottom: 2px;
    }

    .top9-inner {
      display: grid;
      grid-template-columns: repeat(9, minmax(110px, 1fr));
      min-width: 990px;
      border: 1px solid #303036;
      border-radius: 10px;
      overflow: hidden;
      background: rgba(17, 17, 19, .96);
    }

    .top9-item {
      min-height: 62px;
      padding: 9px 10px;
      border-right: 1px solid #27272a;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 3px;
    }

    .top9-item:last-child {
      border-right: none;
    }

    .top9-rank {
      color: #71717a;
      font-size: 9px;
      font-weight: 800;
      letter-spacing: .7px;
      text-transform: uppercase;
    }

    .top9-name {
      color: #f4f4f5;
      font-size: 12px;
      font-weight: 800;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .top9-item.empty .top9-name {
      color: #52525b;
    }

    /* BRACKET */

    .bracket-page { width: 100%; }

    .bracket-heading {
      display:flex;
      align-items:flex-end;
      justify-content:space-between;
      gap:20px;
      margin:4px 0 18px;
    }

    .bracket-heading h2 { margin:0; font-size:21px; }
    .bracket-heading p { margin:4px 0 0; color:#71717a; font-size:12px; }

    .bracket-scroll { overflow-x:auto; padding-bottom:14px; scrollbar-width:thin; }
    .bracket-area { min-width:1120px; }

    .bracket-section {
      margin-bottom:22px;
      border:1px solid #27272a;
      border-radius:10px;
      background:rgba(10,10,12,.54);
      padding:16px 16px 18px;
    }
    .bracket-section:last-child { margin-bottom:0; }

    .zone-title {
      display:flex;
      align-items:center;
      justify-content:center;
      min-height:34px;
      margin:0 0 18px;
      color:#f4f4f5;
      font-size:11px;
      font-weight:900;
      letter-spacing:1.2px;
      text-transform:uppercase;
      text-align:center;
      border-bottom:1px solid #27272a;
      padding-bottom:12px;
    }

    .bracket-grid {
      display:grid;
      align-items:start;
      gap:34px;
    }

    .upper-grid { grid-template-columns: 1fr 1fr 1fr; }
    .lower-grid { grid-template-columns: 1fr 1fr 1fr 1fr; }

    .bracket-column { min-width:0; }

    .round-label {
      color:#a1a1aa;
      font-size:10px;
      font-weight:800;
      letter-spacing:.8px;
      text-transform:uppercase;
      text-align:center;
      margin:0 0 12px;
      min-height:14px;
    }

    .round-subtitle {
      color:#52525b;
      font-size:9px;
      font-weight:600;
      text-align:center;
      margin:-7px 0 10px;
    }

    .match-stack { display:flex; flex-direction:column; }
    .match-stack.qf { gap:22px; }
    .match-stack.sf { padding-top:48px; gap:88px; }
    .match-stack.uf { padding-top:142px; }

    .match-stack.lower-qf { gap:22px; }
    .match-stack.lower-sf { padding-top:48px; gap:88px; }
    .match-stack.lower-final { padding-top:142px; }

    .match-stack.ranking { gap:0; }

    .match-card {
      background:rgba(17,17,19,.97);
      border:1px solid #303036;
      border-radius:8px;
      overflow:hidden;
      box-shadow:0 6px 18px rgba(0,0,0,.16);
    }

    .match-title {
      min-height:29px;
      padding:7px 10px;
      background:#18181b;
      color:#a1a1aa;
      font-size:9px;
      font-weight:800;
      letter-spacing:.5px;
      text-transform:uppercase;
      border-bottom:1px solid #27272a;
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:8px;
    }

    .match-format {
      color:#52525b;
      font-size:8px;
      letter-spacing:.4px;
    }

    .player {
      min-height:36px;
      padding:8px 10px;
      font-size:12px;
      border-bottom:1px solid #27272a;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:8px;
    }

    .player:last-child { border-bottom:none; }
    .player.winner { font-weight:800; background:rgba(34,197,94,.045); }
    .player-name { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }

    .winner-pill {
      display:inline-flex;
      align-items:center;
      padding:2px 6px;
      border-radius:999px;
      background:rgba(34,197,94,.12);
      border:1px solid rgba(34,197,94,.35);
      color:#4ade80;
      font-size:7px;
      font-weight:800;
      letter-spacing:.5px;
      flex-shrink:0;
    }

    .empty-player { color:#52525b; }

    .ranking-grid {
      display:grid;
      grid-template-columns:repeat(4, 1fr);
      gap:16px;
    }

    .ranking-card {
      border:1px solid #303036;
      border-radius:9px;
      background:rgba(17,17,19,.94);
      overflow:hidden;
    }

    .ranking-card-head {
      min-height:48px;
      padding:10px 12px;
      border-bottom:1px solid #27272a;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
    }

    .ranking-card-title {
      color:#f4f4f5;
      font-size:11px;
      font-weight:900;
      letter-spacing:.7px;
      text-transform:uppercase;
    }

    .rank-badge {
      padding:3px 7px;
      border-radius:5px;
      background:#18181b;
      border:1px solid #303036;
      color:#d4d4d8;
      font-size:8px;
      font-weight:800;
      white-space:nowrap;
    }

    .ranking-card .match-card {
      border:0;
      border-radius:0;
      box-shadow:none;
    }

    .ranking-card .placement-summary {
      border-top:1px solid #27272a;
      padding:10px 12px;
      display:grid;
      gap:5px;
      font-size:9px;
      color:#71717a;
    }

    .placement-summary span {
      display:flex;
      justify-content:space-between;
      gap:10px;
    }

    .placement-summary strong { color:#f4f4f5; }

    .challenge-wrap {
      display:grid;
      grid-template-columns:minmax(300px, 520px) minmax(300px, 1fr);
      gap:24px;
      align-items:start;
    }

    .challenge-card {
      border:1px solid #303036;
      border-radius:9px;
      background:rgba(17,17,19,.94);
      overflow:hidden;
    }

    .challenge-meta {
      padding:12px 14px;
      border-bottom:1px solid #27272a;
    }

    .challenge-meta-title {
      color:#f4f4f5;
      font-size:11px;
      font-weight:900;
      letter-spacing:.7px;
      text-transform:uppercase;
    }

    .challenge-meta-sub {
      margin-top:6px;
      color:#71717a;
      font-size:10px;
    }

    .challenge-note {
      min-height:100%;
      padding:14px 16px;
      border:1px solid #303036;
      border-radius:9px;
      background:rgba(17,17,19,.82);
      color:#a1a1aa;
      font-size:11px;
      line-height:1.55;
    }

    .challenge-note strong { color:#f4f4f5; }

    .final-ranklist {
      margin-top:12px;
      padding:12px 14px;
      border:1px solid #303036;
      border-radius:8px;
      background:#18181b;
      color:#f4f4f5;
      font-size:11px;
      font-weight:800;
      text-align:center;
      text-transform:uppercase;
      letter-spacing:.7px;
    }

    /* MOBILE */

    @media (max-width: 800px) {
      .container { padding: 18px 12px 40px; }
      header { align-items: flex-start; }
      .brand h1 { font-size: 24px; }
      .status { text-align: left; }
    }

    @media (max-width: 520px) {
      select { max-width: 100%; }
      table { min-width: 600px; }
    }
  </style>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <link rel="icon" type="image/png" href="/logo.png">
  
</head>

<body>
  <div class="container">

    <header>
      <div class="brand">
        <h1>ASUS TUF GAMES 2026</h1>
        <p>Live Competition Leaderboard</p>
      </div>

      <div class="status" id="status">Loading...</div>
    </header>

    <div class="controls">
      <select id="gameSelect">
        <option value="overall">Overall</option>
        <option value="Valorant">Valorant</option>
        <option value="Cube Racer 2">Cube Racer 2</option>
        <option value="Brawlhalla">Brawlhalla</option>
        <option value="Fall Guys">Fall Guys</option>
        <option value="Rocket League">Rocket League</option>
      </select>
    </div>

    <div id="content">
      <div class="loading">Loading leaderboard...</div>
    </div>

  </div>

  <script>
    const API_URL = "/api/leaderboard";

    let leaderboardData = {};
    let currentView = "overall";

    async function loadLeaderboard() {
      try {
        setStatus("Updating...");

        const response = await fetch(API_URL, {
          cache: "no-store"
        });

        if (!response.ok) {
          throw new Error(`API returned ${response.status}`);
        }

        const data = await response.json();

        if (!data || typeof data !== "object") {
          throw new Error("Invalid API response");
        }

        leaderboardData = data;
        renderCurrentView();

        setStatus(
          "Updated " +
          new Date().toLocaleTimeString([], {
            hour: "2-digit",
            minute: "2-digit"
          })
        );
      } catch (error) {
        console.error("Leaderboard loading error:", error);
        setStatus("Connection error");

        document.getElementById("content").innerHTML = `
          <div class="error">
            Unable to load leaderboard.<br><br>
            Please refresh the page.
          </div>
        `;
      }
    }

    function setStatus(text) {
      const status = document.getElementById("status");
      if (status) status.textContent = text;
    }

    function renderCurrentView() {
      if (!leaderboardData ||
          Object.keys(leaderboardData).length === 0) {
        document.getElementById("content").innerHTML =
          `<div class="loading">No leaderboard data available.</div>`;
        return;
      }

      if (currentView === "overall") {
        renderTable("overall");
        return;
      }

      if (currentView === "Brawlhalla") {
        renderBrawlhallaBracket();
        return;
      }

      if (currentView === "Rocket League") {
        renderRocketLeagueBracket();
        return;
      }

      renderTable(currentView);
    }

    function renderTable(sheetName) {
      const data = leaderboardData[sheetName];

      if (!data || !data.length) {
        document.getElementById("content").innerHTML =
          `<div class="error">No data found for ${escapeHTML(sheetName)}.</div>`;
        return;
      }

      let headerIndex = -1;

      for (let i = 0; i < data.length; i++) {
        const row = data[i].map(v => String(v).trim().toLowerCase());
        const nonEmpty = row.filter(v => v !== "");

        const hasRank =
          row.includes("rank") ||
          row.includes("overall rank");

        const hasPlayer =
          row.includes("creator") ||
          row.includes("player");

        if (nonEmpty.length >= 2 && hasRank && hasPlayer) {
          headerIndex = i;
          break;
        }
      }

      if (headerIndex === -1) {
        for (let i = 0; i < data.length; i++) {
          const row = data[i].map(v => String(v).trim().toLowerCase());
          const nonEmpty = row.filter(v => v !== "");

          if (
            nonEmpty.length >= 2 &&
            (
              row.includes("rank") ||
              row.includes("creator") ||
              row.includes("player") ||
              row.includes("total")
            )
          ) {
            headerIndex = i;
            break;
          }
        }
      }

      if (headerIndex === -1) {
        document.getElementById("content").innerHTML =
          `<div class="error">Could not detect table headers.</div>`;
        return;
      }

      const headers = data[headerIndex];

      const rows = data
        .slice(headerIndex + 1)
        .filter(row =>
          row.some(cell => String(cell).trim() !== "")
        );

      let html = `
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
      `;

      headers.forEach(header => {
        html += `<th>${escapeHTML(header)}</th>`;
      });

      html += `
              </tr>
            </thead>
            <tbody>
      `;

      rows.forEach(row => {
        html += "<tr>";

        headers.forEach((_, index) => {
          const value =
            row[index] !== undefined ? row[index] : "";

          html += `<td>${escapeHTML(value)}</td>`;
        });

        html += "</tr>";
      });

      html += `
            </tbody>
          </table>
        </div>
      `;

      document.getElementById("content").innerHTML = html;
    }

    /* =====================================================
       BRACKET DATA
       ===================================================== */

    function getBracketRows(sheetName) {
      const data = leaderboardData[sheetName];

      if (!data || !data.length) return null;

      let headerIndex = -1;

      for (let i = 0; i < data.length; i++) {
        const row = data[i].map(v =>
          String(v).trim().toLowerCase()
        );

        if (
          row.includes("match") &&
          row.includes("p1") &&
          row.includes("p2") &&
          row.includes("win") &&
          row.includes("loss")
        ) {
          headerIndex = i;
          break;
        }
      }

      if (headerIndex === -1) return null;

      return data
        .slice(headerIndex + 1)
        .filter(row =>
          row.some(cell => String(cell).trim() !== "")
        )
        .map(row => ({
          match: String(row[0] || "").trim(),
          p1: String(row[1] || "").trim(),
          p2: String(row[2] || "").trim(),
          win: String(row[3] || "").trim()
        }));
    }

    function matchMap(rows) {
      const map = {};

      rows.forEach(row => {
        map[row.match.toUpperCase()] = row;
      });

      return map;
    }

    function renderTop9Strip() {
      const data = leaderboardData["overall"];

      if (!data || !data.length) return "";

      let headerIndex = -1;

      for (let i = 0; i < data.length; i++) {
        const row = data[i].map(v =>
          String(v).trim().toLowerCase()
        );

        if (
          (row.includes("overall rank") || row.includes("rank")) &&
          (row.includes("creator") || row.includes("player"))
        ) {
          headerIndex = i;
          break;
        }
      }

      if (headerIndex === -1) return "";

      const headers = data[headerIndex];
      const rankIndex = headers.findIndex(h =>
        ["overall rank", "rank"].includes(
          String(h).trim().toLowerCase()
        )
      );
      const playerIndex = headers.findIndex(h =>
        ["creator", "player"].includes(
          String(h).trim().toLowerCase()
        )
      );

      if (rankIndex === -1 || playerIndex === -1) return "";

      const players = {};

      data.slice(headerIndex + 1).forEach(row => {
        const rank = String(row[rankIndex] || "").trim();
        const player = String(row[playerIndex] || "").trim();

        if (/^[1-9]$/.test(rank)) {
          players[rank] = player;
        }
      });

      let html = `
        <div class="top9-strip">
          <div class="top9-inner">
      `;

      for (let i = 1; i <= 9; i++) {
        const player = players[String(i)] || "";

        html += `
          <div class="top9-item ${player ? "" : "empty"}">
            <div class="top9-rank">#${i}</div>
            <div class="top9-name">
              ${escapeHTML(player || "-")}
            </div>
          </div>
        `;
      }

      html += `
          </div>
        </div>
      `;

      return html;
    }

    function renderPlacementBracket(sheetName) {
      const rows = getBracketRows(sheetName);

      if (!rows) {
        document.getElementById("content").innerHTML =
          `<div class="error">Could not detect ${escapeHTML(sheetName)} bracket data.</div>`;
        return;
      }

      const matches = matchMap(rows);

      /*
        FINAL WEBSITE BRACKET — Brawlhalla + Rocket League

        Upper: M1-M7
        Lower: M8-M13
        Ranking: M14-M17
        Challenge: M18

        The website is read-only. P1/P2/Win values come directly from the Sheet.
        No progression, ranking, sorting or winner calculation is performed here.
      */

      const rankingCard = (match, title, badge, winnerRank, loserRank) => `
        <div class="ranking-card">
          <div class="ranking-card-head">
            <div class="ranking-card-title">${title}</div>
            <div class="rank-badge">${badge}</div>
          </div>
          ${card(match)}
          <div class="placement-summary">
            <span><span>${winnerRank ? 'Winner' : ''}</span><strong>${winnerRank || ''}</strong></span>
            <span><span>${loserRank ? 'Runner-up' : ''}</span><strong>${loserRank || ''}</strong></span>
          </div>
        </div>
      `;

      const html = `
        <div class="bracket-page">
          ${renderTop9Strip()}

          <div class="bracket-heading">
            <div>
              <h2>${escapeHTML(sheetName)} Bracket</h2>
              <p>Placement + ranking bracket</p>
            </div>
          </div>

          <div class="bracket-scroll">
            <div class="bracket-area">

              <section class="bracket-section">
                <div class="zone-title">● &nbsp; Upper Bracket (Winners) <span style="color:#71717a;font-weight:600;margin-left:8px;text-transform:none;letter-spacing:0;">(Matches M1 – M7)</span></div>
                <div class="bracket-grid upper-grid">
                  <div class="bracket-column">
                    <div class="round-label">Round 1 • Quarterfinals</div>
                    <div class="match-stack qf">
                      ${card(matches.M1)}
                      ${card(matches.M2)}
                      ${card(matches.M3)}
                      ${card(matches.M4)}
                    </div>
                  </div>

                  <div class="bracket-column">
                    <div class="round-label">Round 2 • Semifinals</div>
                    <div class="match-stack sf">
                      ${card(matches.M5)}
                      ${card(matches.M6)}
                    </div>
                  </div>

                  <div class="bracket-column">
                    <div class="round-label">Round 3 • Upper Final</div>
                    <div class="match-stack uf">
                      ${card(matches.M7)}
                    </div>
                  </div>
                </div>
              </section>

              <section class="bracket-section">
                <div class="zone-title">● &nbsp; Lower Bracket (Losers) <span style="color:#71717a;font-weight:600;margin-left:8px;text-transform:none;letter-spacing:0;">(Matches M8 – M13)</span></div>
                <div class="bracket-grid lower-grid">
                  <div class="bracket-column">
                    <div class="round-label">Losers Round 1</div>
                    <div class="match-stack lower-qf">
                      ${card(matches.M8)}
                      ${card(matches.M9)}
                    </div>
                  </div>

                  <div class="bracket-column">
                    <div class="round-label">Losers Round 2</div>
                    <div class="match-stack lower-sf">
                      ${card(matches.M10)}
                      ${card(matches.M11)}
                    </div>
                  </div>

                  <div class="bracket-column">
                    <div class="round-label">Losers Semifinal</div>
                    <div class="match-stack lower-final">
                      ${card(matches.M12)}
                    </div>
                  </div>

                  <div class="bracket-column">
                    <div class="round-label">Losers Final</div>
                    <div class="match-stack lower-final">
                      ${card(matches.M13)}
                    </div>
                  </div>
                </div>
              </section>

              <section class="bracket-section">
                <div class="zone-title">● &nbsp; Ranking Bracket (Placement Classification) <span style="color:#71717a;font-weight:600;margin-left:8px;text-transform:none;letter-spacing:0;">(Matches M14 – M17)</span></div>
                <div class="ranking-grid">
                  ${rankingCard(matches.M17, 'Grand Final', '#1 & #2', '#1', '#2')}
                  ${rankingCard(matches.M16, 'Bronze Match', '#3 & #4', '#3', '#4')}
                  ${rankingCard(matches.M15, '5th / 6th Match', '#5 & #6', '#5', '#6')}
                  ${rankingCard(matches.M14, '7th / 8th Match', '#7 & #8', '#7', '#8')}
                </div>
              </section>
              
            </div>
          </div>
        </div>
      `;

      document.getElementById("content").innerHTML = html;
    }

    function renderBrawlhallaBracket() {
      renderPlacementBracket("Brawlhalla");
    }

    function renderRocketLeagueBracket() {
      renderPlacementBracket("Rocket League");
    }

    function card(match, format = "BO1") {
      if (!match) {
        return `
          <div class="match-card">
            <div class="match-title">MATCH</div>
            <div class="player empty-player">-</div>
            <div class="player empty-player">-</div>
          </div>
        `;
      }

      const winner = match.win.toLowerCase();
      const p1Winner =
        match.p1 !== "" &&
        winner !== "" &&
        match.p1.toLowerCase() === winner;

      const p2Winner =
        match.p2 !== "" &&
        winner !== "" &&
        match.p2.toLowerCase() === winner;

      return `
        <div class="match-card">

          <div class="match-title">
            <span>${escapeHTML(match.match)}</span>
            <span class="match-format">${escapeHTML(format)}</span>
          </div>

          <div class="player ${p1Winner ? "winner" : ""}">
            <span class="player-name ${
              match.p1 ? "" : "empty-player"
            }">
              ${escapeHTML(match.p1 || "-")}
            </span>

            ${
              p1Winner
                ? `<span class="winner-pill">WINNER</span>`
                : ""
            }
          </div>

          <div class="player ${p2Winner ? "winner" : ""}">
            <span class="player-name ${
              match.p2 ? "" : "empty-player"
            }">
              ${escapeHTML(match.p2 || "-")}
            </span>

            ${
              p2Winner
                ? `<span class="winner-pill">WINNER</span>`
                : ""
            }
          </div>

        </div>
      `;
    }

    function escapeHTML(value) {
      return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    document
      .getElementById("gameSelect")
      .addEventListener("change", function () {
        currentView = this.value;
        renderCurrentView();
      });

    loadLeaderboard();

    setInterval(loadLeaderboard, 30000);
  </script>
</body>
</html>
