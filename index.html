<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>ASUS BA Q4 — Leaderboard</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #09090b;
      color: #ffffff;
      font-family: Inter, Arial, Helvetica, sans-serif;
    }

    .container {
      max-width: 1200px;
      margin: auto;
      padding: 30px 18px 60px;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      gap: 20px;
      margin-bottom: 30px;
    }

    .title {
      font-size: 32px;
      font-weight: 800;
      letter-spacing: -1px;
    }

    .subtitle {
      margin-top: 6px;
      color: #888;
      font-size: 14px;
    }

    .status {
      color: #777;
      font-size: 12px;
      text-align: right;
    }

    .controls {
      margin-bottom: 24px;
    }

    select {
      background: #151518;
      color: white;
      border: 1px solid #2b2b30;
      border-radius: 8px;
      padding: 12px 15px;
      font-size: 14px;
      min-width: 220px;
      outline: none;
    }

    select:focus {
      border-color: #555;
    }

    /* NORMAL TABLE */

    .table-wrapper {
      overflow-x: auto;
      border: 1px solid #26262b;
      border-radius: 12px;
      background: #111114;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 650px;
    }

    th {
      padding: 15px;
      text-align: left;
      color: #777;
      font-size: 12px;
      font-weight: 600;
      border-bottom: 1px solid #29292e;
    }

    td {
      padding: 16px 15px;
      font-size: 14px;
      border-bottom: 1px solid #202024;
    }

    tr:last-child td {
      border-bottom: none;
    }

    td:first-child {
      font-weight: 800;
    }

    /* BRACKET */

    .bracket {
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    .round {
      border: 1px solid #26262b;
      border-radius: 12px;
      background: #111114;
      overflow: hidden;
    }

    .round-title {
      padding: 14px 16px;
      font-size: 13px;
      font-weight: 700;
      color: #aaa;
      border-bottom: 1px solid #29292e;
      text-transform: uppercase;
      letter-spacing: .5px;
    }

    .match {
      display: grid;
      grid-template-columns: 100px 1fr 1fr 90px 90px;
      align-items: center;
      min-height: 58px;
      border-bottom: 1px solid #202024;
    }

    .match:last-child {
      border-bottom: none;
    }

    .match > div {
      padding: 14px 12px;
      font-size: 14px;
    }

    .match-name {
      color: #777;
      font-weight: 700;
    }

    .player {
      font-weight: 600;
    }

    .result {
      color: #aaa;
      text-align: center;
    }

    .result.win {
      color: #fff;
      font-weight: 700;
    }

    .result.loss {
      color: #666;
    }

    .final {
      border-color: #444;
    }

    .final .round-title {
      color: #fff;
    }

    .loading {
      padding: 60px 20px;
      text-align: center;
      color: #777;
    }

    .error {
      padding: 40px 20px;
      text-align: center;
      color: #ff6b6b;
    }

    @media (max-width: 700px) {

      .container {
        padding: 20px 10px 40px;
      }

      .header {
        align-items: flex-start;
        flex-direction: column;
      }

      .title {
        font-size: 25px;
      }

      .status {
        text-align: left;
      }

      select {
        width: 100%;
      }

      .match {
        grid-template-columns: 70px 1fr 1fr 60px 60px;
      }

      .match > div {
        padding: 12px 8px;
        font-size: 12px;
      }

      .round-title {
        font-size: 12px;
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="header">

      <div>
        <div class="title">ASUS BA Q4</div>
        <div class="subtitle">
          Live Competition Leaderboard
        </div>
      </div>

      <div class="status" id="status">
        Loading...
      </div>

    </div>

    <div class="controls">

      <select id="gameSelect" onchange="changeGame()">

        <option value="overall">
          Overall
        </option>

        <option value="Valorant">
          Valorant
        </option>

        <option value="Rocket League">
          Rocket League
        </option>

        <option value="PolyTrack">
          PolyTrack
        </option>

        <option value="Stumble Guys">
          Stumble Guys
        </option>

        <option value="Brawlhalla">
          Brawlhalla
        </option>

      </select>

    </div>

    <div id="content">

      <div class="loading">
        Loading leaderboard...
      </div>

    </div>

  </div>


<script>

let leaderboard = {};

let currentGame = "overall";


/* =========================
   LOAD DATA
========================= */

async function loadLeaderboard() {

  try {

    document.getElementById("status").innerText =
      "Updating...";

    const response =
      await fetch("/api/leaderboard");

    if (!response.ok) {
      throw new Error("API error");
    }

    leaderboard =
      await response.json();

    render();

    document.getElementById("status").innerText =
      "Updated " +
      new Date().toLocaleTimeString([], {
        hour: "2-digit",
        minute: "2-digit"
      });

  }

  catch (error) {

    console.error(error);

    document.getElementById("content").innerHTML = `
      <div class="error">
        Unable to load leaderboard.
      </div>
    `;

    document.getElementById("status").innerText =
      "Connection error";
  }

}


/* =========================
   CHANGE GAME
========================= */

function changeGame() {

  currentGame =
    document.getElementById("gameSelect").value;

  render();

}


/* =========================
   MAIN RENDER
========================= */

function render() {

  const data =
    leaderboard[currentGame];

  if (!data || data.length === 0) {

    document.getElementById("content").innerHTML = `
      <div class="loading">
        No data available.
      </div>
    `;

    return;
  }


  /*
    RL + Brawlhalla
    use bracket renderer
  */

  if (
    currentGame === "Rocket League" ||
    currentGame === "Brawlhalla"
  ) {

    renderBracket(data);

    return;
  }


  /*
    Everything else:
    normal leaderboard
  */

  renderTable(data);

}


/* =========================
   NORMAL TABLE
========================= */

function renderTable(data) {

  let headerIndex = -1;


  for (
    let i = 0;
    i < data.length;
    i++
  ) {

    const row =
      data[i]
        .map(x =>
          String(x)
            .trim()
            .toLowerCase()
        );


    if (
      row.includes("rank") ||
      row.includes("overall rank") ||
      row.includes("creator") ||
      row.includes("player")
    ) {

      headerIndex = i;

      break;
    }

  }


  if (headerIndex === -1) {

    document.getElementById("content").innerHTML = `
      <div class="error">
        Could not detect table headers.
      </div>
    `;

    return;
  }


  const headers =
    data[headerIndex];


  const rows =
    data
      .slice(headerIndex + 1)
      .filter(row =>
        row.some(cell =>
          String(cell).trim() !== ""
        )
      );


  let html = `

    <div class="table-wrapper">

      <table>

        <thead>

          <tr>
  `;


  headers.forEach(header => {

    if (
      String(header).trim() !== ""
    ) {

      html += `
        <th>
          ${escapeHtml(header)}
        </th>
      `;

    }

  });


  html += `

          </tr>

        </thead>

        <tbody>

  `;


  rows.forEach(row => {

    html += "<tr>";


    for (
      let i = 0;
      i < headers.length;
      i++
    ) {

      if (
        String(headers[i]).trim() === ""
      ) {
        continue;
      }


      html += `

        <td>
          ${escapeHtml(row[i] ?? "")}
        </td>

      `;

    }


    html += "</tr>";

  });


  html += `

        </tbody>

      </table>

    </div>

  `;


  document.getElementById("content")
    .innerHTML = html;

}


/* =========================
   BRACKET RENDERER
========================= */

function renderBracket(data) {

  /*
    Expected structure:

    Match | P1 | P2 | Win | Loss

    QF1
    QF2
    QF3
    QF4
    SF1
    SF2
    FINALE 1
    FINALE 2
    FINALE 3
  */


  let headerIndex = -1;


  for (
    let i = 0;
    i < data.length;
    i++
  ) {

    const row =
      data[i]
        .map(x =>
          String(x)
            .trim()
            .toLowerCase()
        );


    if (
      row.includes("match") &&
      row.includes("p1") &&
      row.includes("p2")
    ) {

      headerIndex = i;

      break;
    }

  }


  if (headerIndex === -1) {

    document.getElementById("content").innerHTML = `
      <div class="error">
        Could not detect bracket headers.
      </div>
    `;

    return;
  }


  const headers =
    data[headerIndex];


  const matchIndex =
    headers.findIndex(
      h =>
        String(h)
          .trim()
          .toLowerCase() === "match"
    );


  const p1Index =
    headers.findIndex(
      h =>
        String(h)
          .trim()
          .toLowerCase() === "p1"
    );


  const p2Index =
    headers.findIndex(
      h =>
        String(h)
          .trim()
          .toLowerCase() === "p2"
    );


  const winIndex =
    headers.findIndex(
      h =>
        String(h)
          .trim()
          .toLowerCase() === "win"
    );


  const lossIndex =
    headers.findIndex(
      h =>
        String(h)
          .trim()
          .toLowerCase() === "loss"
    );


  const matches =
    data
      .slice(headerIndex + 1)
      .filter(row =>
        row.some(cell =>
          String(cell).trim() !== ""
        )
      );


  const quarterFinals =
    matches.filter(row =>
      /^QF/i.test(
        String(row[matchIndex] ?? "")
      )
    );


  const semiFinals =
    matches.filter(row =>
      /^SF/i.test(
        String(row[matchIndex] ?? "")
      )
    );


  const finals =
    matches.filter(row =>
      /^FINALE/i.test(
        String(row[matchIndex] ?? "")
      )
    );


  let html = `
    <div class="bracket">
  `;


  if (quarterFinals.length) {

    html += renderRound(
      "Quarter Finals",
      quarterFinals
    );

  }


  if (semiFinals.length) {

    html += renderRound(
      "Semi Finals",
      semiFinals
    );

  }


  if (finals.length) {

    html += renderRound(
      "Final — Best of 3",
      finals,
      true
    );

  }


  html += `
    </div>
  `;


  document.getElementById("content")
    .innerHTML = html;


  function renderRound(
    title,
    rows,
    isFinal = false
  ) {

    let output = `

      <div class="round ${isFinal ? "final" : ""}">

        <div class="round-title">
          ${title}
        </div>
    `;


    rows.forEach(row => {

      const match =
        row[matchIndex] ?? "";

      const p1 =
        row[p1Index] ?? "";

      const p2 =
        row[p2Index] ?? "";

      const win =
        row[winIndex] ?? "";

      const loss =
        row[lossIndex] ?? "";


      output += `

        <div class="match">

          <div class="match-name">
            ${escapeHtml(match)}
          </div>

          <div class="player">
            ${escapeHtml(p1)}
          </div>

          <div class="player">
            ${escapeHtml(p2)}
          </div>

          <div class="result win">
            ${escapeHtml(win)}
          </div>

          <div class="result loss">
            ${escapeHtml(loss)}
          </div>

        </div>

      `;

    });


    output += `
      </div>
    `;


    return output;

  }

}


/* =========================
   SECURITY
========================= */

function escapeHtml(value) {

  return String(value)

    .replace(
      /&/g,
      "&amp;"
    )

    .replace(
      /</g,
      "&lt;"
    )

    .replace(
      />/g,
      "&gt;"
    )

    .replace(
      /"/g,
      "&quot;"
    )

    .replace(
      /'/g,
      "&#039;"
    );

}


/* =========================
   START
========================= */

loadLeaderboard();


/*
  Refresh every 30 seconds
*/

setInterval(
  loadLeaderboard,
  30000
);

</script>

</body>

</html>
