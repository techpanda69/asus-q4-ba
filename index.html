<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>ASUS BA Q4 — Leaderboard</title>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #09090b;
      color: #ffffff;
      font-family:
        Inter,
        Arial,
        Helvetica,
        sans-serif;
    }

    .container {
      max-width: 1200px;
      margin: auto;
      padding: 30px 18px 60px;
    }

    /* HEADER */

    .header {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      gap: 20px;
      margin-bottom: 30px;
    }

    .title {
      font-size: 32px;
      font-weight: 800;
      letter-spacing: -1px;
    }

    .subtitle {
      margin-top: 6px;
      color: #888;
      font-size: 14px;
    }

    .status {
      color: #777;
      font-size: 12px;
      text-align: right;
    }

    /* CONTROLS */

    .controls {
      margin-bottom: 18px;
    }

    select {
      background: #151518;
      color: white;

      border: 1px solid #2b2b30;
      border-radius: 8px;

      padding: 12px 15px;

      font-size: 14px;
      min-width: 220px;

      outline: none;
    }

    select:focus {
      border-color: #555;
    }

    /* TABLE */

    .table-wrapper {
      overflow-x: auto;

      border: 1px solid #26262b;
      border-radius: 12px;

      background: #111114;
    }

    table {
      width: 100%;
      border-collapse: collapse;

      min-width: 650px;
    }

    th {
      padding: 15px;

      text-align: left;

      color: #777;
      font-size: 12px;
      font-weight: 600;

      border-bottom: 1px solid #29292e;
    }

    td {
      padding: 16px 15px;

      font-size: 14px;

      border-bottom: 1px solid #202024;
    }

    tr:last-child td {
      border-bottom: none;
    }

    td:first-child {
      font-weight: 800;
    }

    /* LOADING */

    .loading {
      padding: 60px 20px;
      text-align: center;

      color: #777;
    }

    /* ERROR */

    .error {
      padding: 40px 20px;

      text-align: center;

      color: #ff6b6b;
    }

    /* MOBILE */

    @media (max-width: 600px) {

      .container {
        padding: 20px 10px 40px;
      }

      .header {
        align-items: flex-start;
        flex-direction: column;
      }

      .title {
        font-size: 25px;
      }

      .status {
        text-align: left;
      }

      select {
        width: 100%;
      }

    }

  </style>

</head>


<body>

  <div class="container">

    <div class="header">

      <div>

        <div class="title">
          ASUS BA Q4
        </div>

        <div class="subtitle">
          Live Competition Leaderboard
        </div>

      </div>

      <div
        class="status"
        id="status"
      >
        Loading...
      </div>

    </div>


    <div class="controls">

      <select
        id="gameSelect"
        onchange="changeGame()"
      >

        <option value="overall">
          Overall
        </option>

        <option value="Valorant">
          Valorant
        </option>

        <option value="Rocket League">
          Rocket League
        </option>

        <option value="PolyTrack">
          PolyTrack
        </option>

        <option value="Stumble Guys">
          Stumble Guys
        </option>

        <option value="Brawlhalla">
          Brawlhalla
        </option>

      </select>

    </div>


    <div id="content">

      <div class="loading">
        Loading leaderboard...
      </div>

    </div>

  </div>


<script>

let leaderboard = {};

let currentGame = "overall";


async function loadLeaderboard() {

  try {

    document.getElementById("status").innerText =
      "Updating...";


    const response =
      await fetch("/api/leaderboard");


    if (!response.ok) {
      throw new Error("API error");
    }


    leaderboard =
      await response.json();


    render();


    document.getElementById("status").innerText =
      "Updated " +
      new Date().toLocaleTimeString([], {
        hour: "2-digit",
        minute: "2-digit"
      });


  } catch (error) {

    console.error(error);

    document.getElementById("content").innerHTML = `
      <div class="error">
        Unable to load leaderboard.
      </div>
    `;

    document.getElementById("status").innerText =
      "Connection error";

  }

}


function changeGame() {

  currentGame =
    document.getElementById("gameSelect").value;

  render();

}


function render() {

  const data =
    leaderboard[currentGame];


  if (!data || data.length === 0) {

    document.getElementById("content").innerHTML = `
      <div class="loading">
        No data available.
      </div>
    `;

    return;

  }


  /*
    Find the first row containing
    actual column headings.
  */

  let headerIndex = -1;


  for (
    let i = 0;
    i < data.length;
    i++
  ) {

    const row = data[i]
      .map(x => String(x).trim().toLowerCase());


    if (
      row.includes("rank") ||
      row.includes("overall rank") ||
      row.includes("creator") ||
      row.includes("player")
    ) {

      headerIndex = i;

      break;

    }

  }


  if (headerIndex === -1) {

    document.getElementById("content").innerHTML = `
      <div class="error">
        Could not detect table headers.
      </div>
    `;

    return;

  }


  const headers =
    data[headerIndex];


  const rows =
    data
      .slice(headerIndex + 1)
      .filter(row =>
        row.some(cell =>
          String(cell).trim() !== ""
        )
      );


  let html = `

    <div class="table-wrapper">

      <table>

        <thead>

          <tr>
  `;


  headers.forEach(header => {

    if (
      String(header).trim() !== ""
    ) {

      html += `
        <th>
          ${escapeHtml(header)}
        </th>
      `;

    }

  });


  html += `
          </tr>

        </thead>

        <tbody>
  `;


  rows.forEach(row => {

    html += "<tr>";


    for (
      let i = 0;
      i < headers.length;
      i++
    ) {

      if (
        String(headers[i]).trim() === ""
      ) {
        continue;
      }


      html += `
        <td>
          ${escapeHtml(row[i] ?? "")}
        </td>
      `;

    }


    html += "</tr>";

  });


  html += `

        </tbody>

      </table>

    </div>

  `;


  document.getElementById("content").innerHTML =
    html;

}


function escapeHtml(value) {

  return String(value)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");

}


/* Initial load */

loadLeaderboard();


/* Refresh every 30 seconds */

setInterval(
  loadLeaderboard,
  30000
);

</script>

</body>

</html>
