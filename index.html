<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>ASUS BA Q4</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #09090b;
      color: #f4f4f5;
      font-family: Arial, Helvetica, sans-serif;
    }

    .container {
      width: 100%;
      max-width: 1200px;
      margin: 0 auto;
      padding: 24px 16px 50px;
    }

    /* HEADER */

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
      margin-bottom: 28px;
      flex-wrap: wrap;
    }

    .brand h1 {
      margin: 0;
      font-size: 28px;
      font-weight: 800;
      letter-spacing: -0.5px;
    }

    .brand p {
      margin: 5px 0 0;
      color: #a1a1aa;
      font-size: 14px;
    }

    .status {
      color: #a1a1aa;
      font-size: 13px;
      text-align: right;
    }

    /* CONTROLS */

    .controls {
      margin-bottom: 22px;
    }

    select {
      width: 100%;
      max-width: 320px;
      background: #18181b;
      color: #f4f4f5;
      border: 1px solid #3f3f46;
      border-radius: 8px;
      padding: 12px 14px;
      font-size: 15px;
      outline: none;
      cursor: pointer;
    }

    select:focus {
      border-color: #71717a;
    }

    /* CONTENT */

    #content {
      width: 100%;
    }

    .loading,
    .error {
      padding: 40px 20px;
      text-align: center;
      color: #a1a1aa;
      background: #111113;
      border: 1px solid #27272a;
      border-radius: 10px;
    }

    .error {
      color: #f87171;
    }

    /* TABLE */

    .table-wrap {
      width: 100%;
      overflow-x: auto;
      border: 1px solid #27272a;
      border-radius: 10px;
      background: #111113;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 650px;
    }

    th {
      background: #18181b;
      color: #d4d4d8;
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      padding: 14px 12px;
      text-align: left;
      border-bottom: 1px solid #27272a;
      white-space: nowrap;
    }

    td {
      padding: 14px 12px;
      border-bottom: 1px solid #27272a;
      color: #f4f4f5;
      font-size: 14px;
      white-space: nowrap;
    }

    tr:last-child td {
      border-bottom: none;
    }

    tbody tr:hover {
      background: #18181b;
    }

    /* BRACKETS */

    .bracket {
      display: flex;
      flex-direction: column;
      gap: 32px;
    }

    .round {
      width: 100%;
    }

    .round h2 {
      margin: 0 0 14px;
      font-size: 17px;
      color: #f4f4f5;
    }

    .match-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(180px, 1fr));
      gap: 14px;
    }

    .match-card {
      background: #111113;
      border: 1px solid #27272a;
      border-radius: 10px;
      overflow: hidden;
    }

    .match-title {
      padding: 10px 12px;
      background: #18181b;
      color: #a1a1aa;
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      border-bottom: 1px solid #27272a;
    }

    .player {
      padding: 13px 12px;
      font-size: 14px;
      border-bottom: 1px solid #27272a;
      min-height: 45px;
      display: flex;
      align-items: center;
    }
.player {
  justify-content: space-between;
  gap: 10px;
}

.player.winner {
  font-weight: 700;
}

.winner-pill {
  display: inline-flex;
  align-items: center;
  padding: 3px 7px;
  border-radius: 999px;
  background: rgba(34, 197, 94, 0.12);
  border: 1px solid rgba(34, 197, 94, 0.35);
  color: #4ade80;
  font-size: 9px;
  font-weight: 800;
  letter-spacing: 0.5px;
  flex-shrink: 0;
}
    .player:last-child {
      border-bottom: none;
    }

    /* MOBILE */

    @media (max-width: 800px) {
      .container {
        padding: 18px 12px 40px;
      }

      header {
        align-items: flex-start;
      }

      .brand h1 {
        font-size: 24px;
      }

      .status {
        text-align: left;
      }

      .match-grid {
        grid-template-columns: repeat(2, minmax(160px, 1fr));
      }
    }

    @media (max-width: 520px) {
      .match-grid {
        grid-template-columns: 1fr;
      }

      select {
        max-width: 100%;
      }

      table {
        min-width: 600px;
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <!-- HEADER -->

    <header>
      <div class="brand">
        <h1>ASUS BA Q4</h1>
        <p>Live Competition Leaderboard</p>
      </div>

      <div class="status" id="status">
        Loading...
      </div>
    </header>


    <!-- GAME SELECTOR -->

    <div class="controls">
      <select id="gameSelect">
        <option value="overall">Overall</option>
        <option value="Valorant">Valorant</option>
        <option value="Rocket League">Rocket League</option>
        <option value="PolyTrack">PolyTrack</option>
        <option value="Stumble Guys">Stumble Guys</option>
        <option value="Brawlhalla">Brawlhalla</option>
      </select>
    </div>


    <!-- CONTENT -->

    <div id="content">
      <div class="loading">
        Loading leaderboard...
      </div>
    </div>

  </div>


  <script>

    /* =====================================================
       CONFIG
    ===================================================== */

    const API_URL = "/api/leaderboard";

    let leaderboardData = {};

    let currentView = "overall";


    /* =====================================================
       LOAD DATA
    ===================================================== */

    async function loadLeaderboard() {

      try {

        setStatus("Updating...");


        const response = await fetch(API_URL, {
          cache: "no-store"
        });


        if (!response.ok) {
          throw new Error(
            `API returned ${response.status}`
          );
        }


        const data = await response.json();


        if (!data || typeof data !== "object") {
          throw new Error("Invalid API response");
        }


        leaderboardData = data;


        renderCurrentView();


        setStatus(
          "Updated " +
          new Date().toLocaleTimeString([], {
            hour: "2-digit",
            minute: "2-digit"
          })
        );


      } catch (error) {

        console.error(
          "Leaderboard loading error:",
          error
        );


        setStatus("Connection error");


        document.getElementById("content").innerHTML = `
          <div class="error">
            Unable to load leaderboard.
            <br><br>
            Please refresh the page.
          </div>
        `;

      }

    }


    /* =====================================================
       STATUS
    ===================================================== */

    function setStatus(text) {

      const status =
        document.getElementById("status");

      if (status) {
        status.textContent = text;
      }

    }


    /* =====================================================
       RENDER CURRENT VIEW
    ===================================================== */

    function renderCurrentView() {

      const content =
        document.getElementById("content");


      if (
        !leaderboardData ||
        Object.keys(leaderboardData).length === 0
      ) {

        content.innerHTML = `
          <div class="loading">
            No leaderboard data available.
          </div>
        `;

        return;
      }


      /*
        Overall is stored with lowercase sheet name.
      */

      if (currentView === "overall") {

        renderTable("overall");

        return;
      }


      /*
        Rocket League and Brawlhalla
        use bracket format.
      */

      if (currentView === "Rocket League") {

        renderBracket("Rocket League");

        return;
      }


      if (currentView === "Brawlhalla") {

        renderBracket("Brawlhalla");

        return;
      }


      /*
        Everything else uses normal tables.
      */

      renderTable(currentView);

    }


    /* =====================================================
       NORMAL TABLE RENDERER
    ===================================================== */

    function renderTable(sheetName) {

      const data =
        leaderboardData[sheetName];


      if (!data || !data.length) {

        document.getElementById("content").innerHTML = `
          <div class="error">
            No data found for ${escapeHTML(sheetName)}.
          </div>
        `;

        return;
      }


      /*
        Find the REAL header row.

        We intentionally do NOT assume
        that headers are on a specific row.

        Overall currently looks like:

        Row 1: blank
        Row 2: Overall Rank
        Row 3: Overall Rank | Creator | Val Rank ...

        So we detect the row containing
        Rank + Creator/Player.
      */

      let headerIndex = -1;


      for (
        let i = 0;
        i < data.length;
        i++
      ) {

        const row =
          data[i].map(value =>
            String(value)
              .trim()
              .toLowerCase()
          );


        const nonEmpty =
          row.filter(value =>
            value !== ""
          );


        const hasRank =
          row.includes("rank") ||
          row.includes("overall rank");


        const hasPlayer =
          row.includes("creator") ||
          row.includes("player");


        if (
          nonEmpty.length >= 2 &&
          hasRank &&
          hasPlayer
        ) {

          headerIndex = i;

          break;
        }

      }


      /*
        If the first detection doesn't work,
        try a more generic header detection.
      */

      if (headerIndex === -1) {

        for (
          let i = 0;
          i < data.length;
          i++
        ) {

          const row =
            data[i].map(value =>
              String(value)
                .trim()
                .toLowerCase()
            );


          const nonEmpty =
            row.filter(value =>
              value !== ""
            );


          if (
            nonEmpty.length >= 2 &&
            (
              row.includes("rank") ||
              row.includes("creator") ||
              row.includes("player") ||
              row.includes("total")
            )
          ) {

            headerIndex = i;

            break;
          }

        }

      }


      /*
        Could not find headers.
      */

      if (headerIndex === -1) {

        document.getElementById("content").innerHTML = `
          <div class="error">
            Could not detect table headers.
          </div>
        `;

        return;
      }


      const headers =
        data[headerIndex];


      /*
        Everything below header is data.

        We don't sort it.
        We don't calculate it.
        We don't modify it.
      */

      const rows =
        data
          .slice(headerIndex + 1)
          .filter(row =>
            row.some(cell =>
              String(cell).trim() !== ""
            )
          );


      let html = `
        <div class="table-wrap">

          <table>

            <thead>

              <tr>
      `;


      headers.forEach(header => {

        html += `
          <th>
            ${escapeHTML(header)}
          </th>
        `;

      });


      html += `
              </tr>

            </thead>

            <tbody>
      `;


      rows.forEach(row => {

        html += "<tr>";


        headers.forEach((_, index) => {

          const value =
            row[index] !== undefined
              ? row[index]
              : "";


          html += `
            <td>
              ${escapeHTML(value)}
            </td>
          `;

        });


        html += "</tr>";

      });


      html += `
            </tbody>

          </table>

        </div>
      `;


      document.getElementById("content")
        .innerHTML = html;

    }


    /* =====================================================
       BRACKET RENDERER
    ===================================================== */

    function renderBracket(sheetName) {

      const data =
        leaderboardData[sheetName];


      if (!data || !data.length) {

        document.getElementById("content").innerHTML = `
          <div class="error">
            No bracket data found.
          </div>
        `;

        return;
      }


      /*
        Find:

        Match | P1 | P2 | Win | Loss
      */

      let headerIndex = -1;


      for (
        let i = 0;
        i < data.length;
        i++
      ) {

        const row =
          data[i].map(value =>
            String(value)
              .trim()
              .toLowerCase()
          );


        if (
          row.includes("match") &&
          row.includes("p1") &&
          row.includes("p2") &&
          row.includes("win") &&
          row.includes("loss")
        ) {

          headerIndex = i;

          break;
        }

      }


      if (headerIndex === -1) {

        document.getElementById("content").innerHTML = `
          <div class="error">
            Could not detect bracket headers.
          </div>
        `;

        return;
      }


      /*
        Data starts after header.
      */

      const rows =
        data
          .slice(headerIndex + 1)
          .filter(row =>
            row.some(cell =>
              String(cell).trim() !== ""
            )
          );


      /*
        Separate rounds ONLY based on
        the Match value.

        No winner calculation.
        No ranking.
        No inference.
      */

      const quarterFinals =
        rows.filter(row =>
          String(row[0])
            .trim()
            .toUpperCase()
            .startsWith("QF")
        );


      const semiFinals =
        rows.filter(row =>
          String(row[0])
            .trim()
            .toUpperCase()
            .startsWith("SF")
        );


      const finals =
        rows.filter(row =>
          String(row[0])
            .trim()
            .toUpperCase()
            .startsWith("FINALE")
        );


      let html = `
        <div class="bracket">

          ${renderBracketRound(
            "Quarter Finals",
            quarterFinals
          )}

          ${renderBracketRound(
            "Semi Finals",
            semiFinals
          )}

          ${renderBracketRound(
            "Final — BO3",
            finals
          )}

        </div>
      `;


      document.getElementById("content")
        .innerHTML = html;

    }


    /* =====================================================
       BRACKET ROUND
    ===================================================== */

   function renderBracketRound(title, rows) {

  if (!rows.length) {
    return "";
  }

  let html = `
    <section class="round">

      <h2>
        ${escapeHTML(title)}
      </h2>

      <div class="match-grid">
  `;

  rows.forEach(row => {

    const match = row[0] || "";
    const p1 = row[1] || "";
    const p2 = row[2] || "";

    // Win column from Google Sheet
    const winner = String(row[3] || "").trim();

    const p1IsWinner =
      p1.trim() !== "" &&
      winner.toLowerCase() === p1.trim().toLowerCase();

    const p2IsWinner =
      p2.trim() !== "" &&
      winner.toLowerCase() === p2.trim().toLowerCase();


    html += `
      <div class="match-card">

        <div class="match-title">
          ${escapeHTML(match)}
        </div>


        <div class="player ${p1IsWinner ? "winner" : ""}">

          <span>
            ${escapeHTML(p1)}
          </span>

          ${
            p1IsWinner
              ? `<span class="winner-pill">WINNER</span>`
              : ""
          }

        </div>


        <div class="player ${p2IsWinner ? "winner" : ""}">

          <span>
            ${escapeHTML(p2)}
          </span>

          ${
            p2IsWinner
              ? `<span class="winner-pill">WINNER</span>`
              : ""
          }

        </div>

      </div>
    `;

  });


  html += `
      </div>

    </section>
  `;

  return html;
}


    /* =====================================================
       HTML ESCAPE
    ===================================================== */

    function escapeHTML(value) {

      return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

    }


    /* =====================================================
       DROPDOWN
    ===================================================== */

    document
      .getElementById("gameSelect")
      .addEventListener(
        "change",
        function () {

          currentView = this.value;

          renderCurrentView();

        }
      );


    /* =====================================================
       INITIAL LOAD
    ===================================================== */

    loadLeaderboard();


    /* =====================================================
       AUTO REFRESH
       Every 30 seconds
    ===================================================== */

    setInterval(
      loadLeaderboard,
      30000
    );

  </script>

</body>
</html>
